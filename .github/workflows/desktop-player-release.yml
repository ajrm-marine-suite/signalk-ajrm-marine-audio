name: Desktop Player release

on:
  workflow_dispatch:
  push:
    tags:
      - "audio-player-v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            command: npm run dist:linux -- --x64 --publish never
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            command: npm run dist:linux -- --arm64 --publish never
          - name: macOS universal
            os: macos-latest
            command: npm run dist:mac -- --universal --publish never
          - name: Windows x64
            os: windows-latest
            command: npm run dist:windows -- --x64 --publish never
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop-player/package-lock.json
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            desktop-player/dist/*.AppImage
            desktop-player/dist/*.deb
            desktop-player/dist/*.dmg
            desktop-player/dist/*.exe
            desktop-player/dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/audio-player-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish unsigned preview installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AJRM Marine Audio Player ${GITHUB_REF_NAME#audio-player-v}" \
            --notes "Unsigned preview installers. Windows and macOS may display security warnings until code-signing certificates are configured."
